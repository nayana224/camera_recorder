[project]
name = "camera-recorder"
version = "0.1.0"
description = "Camera recorder for experiments (USB webcams, RealSense)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyyaml>=6",
]

# Camera SDKs are per-backend extras, so one camera's SDK never blocks another.
[project.optional-dependencies]
realsense = ["pyrealsense2>=2.55"]

[project.scripts]
camrec = "camera_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_recorder"]
